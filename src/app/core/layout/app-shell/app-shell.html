<div class="shell">
@if (toast.message()) {
  <div class="toast" [class.toast-error]="toast.type() === 'error'">{{ toast.message() }}</div>
}
  <nav class="topnav">
    <a routerLink="/" class="nav-brand">ERP<span>.</span></a>
    <div class="nav-user">
      <span>{{ auth.currentUser()?.fullName }}</span>
      <button (click)="auth.logout()">Log out</button>
    </div>
  </nav>
  <main class="shell-content">
    <router-outlet />
  </main>
</div>
